[package]
name = "didawork"
version = "0.1.0"
description = "DiDaWork — 轻量的工作计时与上下班闹钟"
authors = ["DiDaWork"]
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "didawork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png：托盘图标以 PNG 字节内嵌，运行期解码
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# 仅 Windows 使用（WinRT toast）；macOS / Linux 走下面的底层 crate 以拿到通知按钮
tauri-plugin-notification = "2"
# 添加自定义铃声时选文件（音乐 / 版权声明）
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地日期 / 时刻处理，只用 naive 类型，不引入时区数据库
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
# 系统通知：走 UserNotifications（UNUserNotificationCenter）。
# 老的 NSUserNotification 在 macOS 11 起就被弃用，如今交付不稳定（时弹时不弹），
# 所以打包后一律用新接口；它的委托能申请授权、能在前台强制弹横幅、能带按钮。
objc2 = "0.6"
block2 = "0.6"
objc2-user-notifications = { version = "0.3", features = [
    "UNUserNotificationCenter",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "block2",
] }
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSError",
    "NSObject",
    "NSSet",
    "NSString",
] }
# 仅 `tauri dev`（裸二进制、没有 bundle id，新接口用不了）时的降级通道，
# 顺便借它把应用身份定下来，避免出现"选择应用"的窗口。
mac-notification-sys = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# 通过 dlopen 在运行时加载 libX11 / libXss，不引入链接期系统依赖
x11-dl = "2.21"
# freedesktop 通知（支持 action 按钮）
notify-rust = "4"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
